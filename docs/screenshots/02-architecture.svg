<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <rect width="1280" height="560" fill="#0e1117"/>
  <text x="60" y="60" font-size="26" font-weight="700" fill="#fafafa">Mimari — 4 bağımsız modül, tek arayüz</text>
  <text x="60" y="86" font-size="14" fill="#9aa0aa">Hiçbir modül diğerini import etmez; her biri komut satırından tek başına da çalışır.</text>
  <!-- module cards -->
  <g font-size="15">
    <rect x="60" y="120" width="260" height="220" rx="12" fill="#1a1d24" stroke="#00e5cc" stroke-width="2"/>
    <text x="80" y="160" font-size="18" font-weight="700" fill="#fafafa">Plaka + OCR</text>
    <text x="80" y="186" font-size="13" fill="#9aa0aa">PlateDetection/</text>
    <text x="80" y="212" fill="#e0e0e0">YOLO + EasyOCR</text>
    <text x="80" y="236" fill="#e0e0e0">çok geçişli tespit</text>
    <text x="80" y="260" fill="#e0e0e0">Türk plaka doğrulama</text>
    <text x="80" y="292" font-size="13" font-weight="700" fill="#28c840">mAP50 %86,1 (gerçek hat)</text>

    <rect x="344" y="120" width="260" height="220" rx="12" fill="#1a1d24" stroke="#febc2e" stroke-width="2"/>
    <text x="364" y="160" font-size="18" font-weight="700" fill="#fafafa">Baret &amp; Yelek</text>
    <text x="364" y="186" font-size="13" fill="#9aa0aa">VestAndBaret/</text>
    <text x="364" y="212" fill="#e0e0e0">5 sınıf: hardhat,</text>
    <text x="364" y="236" fill="#e0e0e0">safety-vest, person…</text>
    <text x="364" y="260" fill="#e0e0e0">iş güvenliği denetimi</text>
    <text x="364" y="292" font-size="13" font-weight="700" fill="#28c840">mAP50 %94,6 (eğitim-val)</text>

    <rect x="628" y="120" width="260" height="220" rx="12" fill="#1a1d24" stroke="#ff4b4b" stroke-width="2"/>
    <text x="648" y="160" font-size="18" font-weight="700" fill="#fafafa">Yangın &amp; Duman</text>
    <text x="648" y="186" font-size="13" fill="#9aa0aa">FireAndSmoke/</text>
    <text x="648" y="212" fill="#e0e0e0">YOLO track + N-of-M</text>
    <text x="648" y="236" fill="#e0e0e0">zamansal onay (4/8, 5/10)</text>
    <text x="648" y="260" fill="#e0e0e0">kanıt fotoğrafı + CSV</text>
    <text x="648" y="292" font-size="13" font-weight="700" fill="#28c840">mAP50 %61,1 (test)</text>

    <rect x="912" y="120" width="260" height="220" rx="12" fill="#1a1d24" stroke="#4da3ff" stroke-width="2"/>
    <text x="932" y="160" font-size="18" font-weight="700" fill="#fafafa">Tıbbi PPE</text>
    <text x="932" y="186" font-size="13" fill="#9aa0aa">MedicalPPE/</text>
    <text x="932" y="212" fill="#e0e0e0">14 sınıf, 640→768 px</text>
    <text x="932" y="236" fill="#e0e0e0">TTA + dilimli tespit</text>
    <text x="932" y="260" fill="#e0e0e0">14,3 bin eğitim görseli</text>
    <text x="932" y="292" font-size="13" font-weight="700" fill="#28c840">mAP50 %80,0 (test)</text>
  </g>
  <!-- arrows down to shared layers -->
  <g stroke="#3a3f4a" stroke-width="2">
    <line x1="190" y1="340" x2="190" y2="380"/>
    <line x1="474" y1="340" x2="474" y2="380"/>
    <line x1="758" y1="340" x2="758" y2="380"/>
    <line x1="1042" y1="340" x2="1042" y2="380"/>
  </g>
  <rect x="60" y="380" width="1112" height="120" rx="12" fill="#262730"/>
  <text x="80" y="412" font-size="16" font-weight="700" fill="#fafafa">Ortak izleme mimarisi (video/canlı)</text>
  <text x="80" y="440" font-size="14" fill="#e0e0e0">YOLO track (kalıcı iz kimliği) → sınıf bazlı güven eşiği (F1 zirvesinden kalibre) → N-of-M zamansal filtre → onay anında kanıt kaydı (fotoğraf + CSV, alarm yok)</text>
  <text x="80" y="468" font-size="14" fill="#e0e0e0">Fotoğraf modunda: TTA her zaman açık, video hız kaygısı yok • Renk dili: ince sarı = aday, kalın renkli = onaylı</text>
</svg>
